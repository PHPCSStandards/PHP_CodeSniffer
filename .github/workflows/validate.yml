name: Validate

on:
  # Run on all pushes and on all pull requests.
  push:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions should be configured at the job level.
permissions: {}

jobs:
  phpcs:
    permissions:
      contents: read # To clone the repo.

    name: Check PHP code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 'latest'
          coverage: none
          tools: cs2pr

      - name: Check PHP code style
        id: phpcs
        run: php "bin/phpcs" --report-full --report-checkstyle=./phpcs-report.xml

      - name: Show PHPCS results in PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml

  checkxml:
    permissions:
      contents: read # To clone the repo.

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'phpcs.xsd'
            pattern: 'phpcs.xsd'
            xsd-url: 'https://www.w3.org/2012/04/XMLSchema.xsd'

          - name: 'Rulesets'
            pattern: './src/Standards/*/ruleset.xml'
            xsd-file: 'phpcs.xsd'

          - name: 'Sniff Documentation'
            pattern: './src/Standards/*/Docs/*/*Standard.xml'
            xsd-url: 'https://phpcsstandards.github.io/PHPCSDevTools/phpcsdocs.xsd'

          # Validate dev tool related XML files.
          - name: 'Project ruleset'
            pattern: 'phpcs.xml.dist'
            xsd-file: 'phpcs.xsd'

          - name: 'PHPUnit <= 9 config'
            pattern: 'phpunit-lte9.xml.dist'
            xsd-url: 'https://raw.githubusercontent.com/sebastianbergmann/phpunit/refs/tags/9.2.6/phpunit.xsd'

          - name: 'PHPUnit 10+ config'
            pattern: 'phpunit.xml.dist'
            xsd-url: 'https://raw.githubusercontent.com/sebastianbergmann/phpunit/refs/heads/10.5/phpunit.xsd'

    name: "Check XML files: ${{ matrix.name }}"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ${{ matrix.name }} against local schema
        if: matrix.xsd-file != ''
        uses: phpcsstandards/xmllint-validate@d0ee207a94a9539f5d14e78e3b13a81385252c88 # v2.0.1
        with:
          pattern: ${{ matrix.pattern }}
          xsd-file: ${{ matrix.xsd-file }}

      - name: Validate ${{ matrix.name }} against remote schema
        if: matrix.xsd-url != ''
        uses: phpcsstandards/xmllint-validate@d0ee207a94a9539f5d14e78e3b13a81385252c88 # v2.0.1
        with:
          pattern: ${{ matrix.pattern }}
          xsd-url: ${{ matrix.xsd-url }}

  xml-cs:
    permissions:
      contents: read # To clone the repo.

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'project ruleset'
            file: './phpcs.xml.dist'
          - name: 'Generic ruleset'
            file: './src/Standards/Generic/ruleset.xml'
          - name: 'PEAR ruleset'
            file: './src/Standards/PEAR/ruleset.xml'
          - name: 'PSR1 ruleset'
            file: './src/Standards/PSR1/ruleset.xml'
          - name: 'PSR2 ruleset'
            file: './src/Standards/PSR2/ruleset.xml'
          - name: 'PSR12 ruleset'
            file: './src/Standards/PSR12/ruleset.xml'
          - name: 'Squiz ruleset'
            file: './src/Standards/Squiz/ruleset.xml'
          - name: 'Zend ruleset'
            file: './src/Standards/Zend/ruleset.xml'

    name: 'XML Code style: ${{ matrix.name }}'
    runs-on: ubuntu-latest

    env:
      XMLLINT_INDENT: '    '

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Updating the lists can fail intermittently, typically after Microsoft has released a new package.
      # This should not be blocking for this job, so ignore any errors from this step.
      # Ref: https://github.com/dotnet/core/issues/4167
      - name: Update the available packages list
        continue-on-error: true
        run: sudo apt-get update

      - name: Install xmllint
        run: sudo apt-get install --no-install-recommends -y libxml2-utils

      # Show XML violations inline in the file diff.
      - name: Enable showing XML issues inline
        uses: korelstar/xmllint-problem-matcher@dd2ad21bd8a2de0187cb621419537f345e7e509c # v1.3.0

      # Check the code-style consistency of the XML files.
      - name: Check XML code style
        run: diff -B ${{ matrix.file }} <(xmllint --format "${{ matrix.file }}")

  yamllint:
    permissions:
      contents: read # To clone the repo.

    name: 'Lint Yaml'
    uses: PHPCSStandards/.github/.github/workflows/reusable-yamllint.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1
    with:
      strict: true

  markdownlint:
    permissions:
      contents: read # To clone the repo.

    name: 'Lint Markdown'
    uses: PHPCSStandards/.github/.github/workflows/reusable-markdownlint.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1

  remark:
    permissions:
      contents: read # To clone the repo.

    name: 'QA Markdown'
    uses: PHPCSStandards/.github/.github/workflows/reusable-remark.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1

  shellcheck:
    permissions:
      contents: read # To clone the repo.

    name: 'ShellCheck'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up problem matcher
        uses: lumaxis/shellcheck-problem-matchers@bf6e0860fd06e4910738c6160dcd2889146ce824 # v2.3.1
        with:
          format: gcc

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          format: gcc

  find-token-properties:
    permissions:
      contents: read # To clone the repo.

    # The properties in the Tokens class have been deprecated.
    # The code in this repository should always use the constants instead.
    name: 'Find use of Tokens properties'
    uses: PHPCSStandards/.github/.github/workflows/reusable-findtokenprops.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1
