name: Build PHARs

on:
  # Run on pushes to the main branches and on pull requests which touch files used when building the PHARs.
  # Prevent the build from running when there are only irrelevant changes.
  push:
    branches:
      - 3.x
      - 4.x
    paths:
      - '.github/workflows/build-phar.yml'
      - '.github/workflows/reusable-build-phar.yml'
      - 'scripts/build-phar.php'
      - 'autoload.php'
      - 'src/Config.php'
      - 'src/Exceptions/RuntimeException.php'
      - 'src/Exceptions/TokenizerException.php'
      - 'src/Tokenizers/PHP.php'
      - 'src/Util/Timing.php'
      - 'src/Util/Tokens.php'
  pull_request:
    paths:
      - '.github/workflows/build-phar.yml'
      - '.github/workflows/reusable-build-phar.yml'
      - 'scripts/build-phar.php'
      - 'autoload.php'
      - 'src/Config.php'
      - 'src/Exceptions/RuntimeException.php'
      - 'src/Exceptions/TokenizerException.php'
      - 'src/Tokenizers/PHP.php'
      - 'src/Util/Timing.php'
      - 'src/Util/Tokens.php'

  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions should be configured at the job level.
permissions: {}

jobs:
  build:
    permissions:
      contents: read # To clone the repo.
      attestations: write # To persist the attestation.
      id-token: write # To mint the OIDC token necessary to request a Sigstore signing certificate.

    strategy:
      matrix:
        # Deliberately missing PHP 8.0 as that PHAR is build and used in the test workflow.
        php: ['7.2', '7.3', '7.4', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', 'nightly']

    name: "Build Phar on PHP: ${{ matrix.php }}"

    uses: ./.github/workflows/reusable-build-phar.yml
    with:
      phpVersion: ${{ matrix.php }}
