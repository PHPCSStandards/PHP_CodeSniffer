name: Label new PRs

on:
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
  # The `pull_request_target` event is used for "normal" PRs to label them when they are opened.
  # This will use the `labeler.yml` file in the default branch of the repo.
  pull_request_target:
    types:
      - opened
      - ready_for_review

# Permissions should be configured at the job level.
permissions: {}

jobs:
  label-new-prs:
    permissions:
      pull-requests: write # To add PR labels.

    if: github.repository_owner == 'PHPCSStandards'

    name: Add labels to new PRs
    runs-on: ubuntu-latest

    steps:
      - name: Label new PRs
        uses: srvaroa/labeler@bf262763a8a8e191f5847873aecc0f29df84f957 # v1.14.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
