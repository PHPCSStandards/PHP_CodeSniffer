name: Validate labeler changes

on:
  pull_request:
    paths:
      - '.github/workflows/label-new-prs.yml'
      - '.github/labeler.yml'

# Permissions should be configured at the job level.
permissions: {}

jobs:
  validate-labeler-workflow:
    permissions:
      contents: read # To clone the repo.

    if: github.repository_owner == 'PHPCSStandards' && github.event.pull_request.merged == false

    name: Validate changes to Labeler logic
    runs-on: ubuntu-latest

    steps:
      # Checkout is needed to use the `use_local_config` option.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify changes to the labeling logic
        uses: srvaroa/labeler@bf262763a8a8e191f5847873aecc0f29df84f957 # v1.14.0
        with:
          use_local_config: true
          fail_on_error: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
